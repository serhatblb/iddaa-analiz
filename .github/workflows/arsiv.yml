name: Mackolik arşivi

# İlk çalışma 2019'dan bugüne her günü indirir (yaklaşık 1 saat); sonrakiler sadece son ayı yeniler.
on:
  schedule:
    - cron: "11 5 * * 1"  # pazartesi 08:11 TR
  workflow_dispatch:

permissions:
  contents: write

jobs:
  arsiv:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Yıl yıl indir ve kaydet
        run: |
          for yil in 2019 2020 2021 2022 2023 2024 2025 2026; do
            python -m iddaa.arsiv --baslangic "$yil-01-01" --bitis "$yil-12-31"
            bash scripts/kaydet.sh "Mackolik arşivi $yil"
          done
