name: Geçmiş veri ve analiz

on:
  schedule:
    - cron: "23 3 * * 1"  # her pazartesi 06:23 Türkiye saati
  workflow_dispatch:

concurrency:
  group: veri
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  gecmis:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: football-data geçmiş maçlarını indir
        run: python -m iddaa.gecmis
      - name: Geçmiş analiz tabloları
        run: python -m iddaa.analiz
      - name: Paneli güncelle
        run: python -m iddaa.panel
      - name: Veriyi repoya kaydet
        if: always()
        run: bash scripts/kaydet.sh "Geçmiş veri ve analiz"
