name: Saatlik toplama

# GitHub'ın zamanlayıcısı (cron) saatlerce gecikebiliyor ya da hiç çalışmıyor. Bu yüzden her çalışma
# bitince yaklaşık bir saat sonra bir sonrakini kendisi başlatır (zincir). Bekleme `bekleme` ortamının
# Wait timer'ıyla (55 dk, runner harcamaz) yapılır; ortam ayarlı değilse devam işi kalan süre kadar uyur.
# Cron sadece yedek: zincir koparsa yeniden başlatır. Aynı anda tek zincir olur (concurrency: zincir).

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      zincir:
        description: "Bitince bir saat sonra kendini yeniden başlatsın"
        type: boolean
        default: true

concurrency:
  group: ${{ (github.event_name == 'schedule' || inputs.zincir) && 'zincir' || format('elle-{0}', github.run_id) }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  topla:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: veri
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Bülten, oranlar, en çok oynananlar
        run: python -m iddaa.topla
      - name: Biten maçların sonuçları (Mackolik)
        if: always()
        continue-on-error: true
        run: python -m iddaa.sonuc
      - name: Kuponlar (09:40'tan sonra günde bir kez oluşturur, rapor ve mail)
        if: always()
        env:
          GMAIL_ADRES: ${{ secrets.GMAIL_ADRES }}
          GMAIL_UYGULAMA_SIFRESI: ${{ secrets.GMAIL_UYGULAMA_SIFRESI }}
          MAIL_ALICI: ${{ secrets.MAIL_ALICI }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python -m iddaa.gunluk
      - name: Paneli güncelle
        if: always()
        run: python -m iddaa.panel
      - name: Veriyi repoya kaydet
        if: always()
        run: bash scripts/kaydet.sh "Veri (saatlik)"

  devam:
    needs: topla
    if: always() && (github.event_name == 'schedule' || inputs.zincir)
    runs-on: ubuntu-latest
    environment: bekleme
    timeout-minutes: 65
    steps:
      - name: Bir sonraki çalışmayı başlat
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          basla=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --jq .run_started_at)
          gecen=$(( $(date +%s) - $(date -d "$basla" +%s) ))
          # Ortamın Wait timer'ı varsa zaten beklenmiştir; yoksa bir saati tamamlayana kadar uyunur
          kalan=$(( 3360 - gecen ))
          if [ "$kalan" -gt 0 ]; then
            echo "::notice::'bekleme' ortamında Wait timer yok; $kalan sn bekleniyor."
            sleep "$kalan"
          fi
          for deneme in 1 2 3; do
            gh workflow run saatlik.yml --repo "$GITHUB_REPOSITORY" --ref main -f zincir=true && exit 0
            sleep $((deneme * 20))
          done
          echo "::error::Sonraki çalışma başlatılamadı."
          exit 1
