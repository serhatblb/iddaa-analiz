name: Saatlik toplama

on:
  schedule:
    - cron: "17 * * * *"  # her saat :17 (UTC)
  workflow_dispatch:

concurrency:
  group: veri
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  topla:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Bülten, oranlar, en çok oynananlar
        run: python -m iddaa.topla
      - name: Biten maçların sonuçları (Mackolik)
        if: always()
        continue-on-error: true
        run: python -m iddaa.sonuc
      - name: Kuponlar (09:40'tan sonra günde bir kez oluşturur, rapor ve mail)
        if: always()
        env:
          GMAIL_ADRES: ${{ secrets.GMAIL_ADRES }}
          GMAIL_UYGULAMA_SIFRESI: ${{ secrets.GMAIL_UYGULAMA_SIFRESI }}
          MAIL_ALICI: ${{ secrets.MAIL_ALICI }}
        run: python -m iddaa.gunluk
      - name: Paneli güncelle
        if: always()
        run: python -m iddaa.panel
      - name: Veriyi repoya kaydet
        if: always()
        run: bash scripts/kaydet.sh "Veri (saatlik)"
