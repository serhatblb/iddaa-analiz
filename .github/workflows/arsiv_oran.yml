name: Geçmiş maç oranları

# Arşivdeki iddaa maçlarının sayfalarından bütün önemli oranlar (İY/MS, toplam gol, KG...), en yeniden eskiye.
# İş, tarih aralıklarına bölünüp paralel parçalarda yapılabilir (her parça ayrı aylara yazar).
# Her parça 30 dakikada bir kaydeder; süre dolunca ya da aralık bitince durur. Sonraki çalışma kaldığı yerden devam eder.
on:
  schedule:
    - cron: "23 1 * * *"  # her gece 04:23 TR
  workflow_dispatch:
    inputs:
      donemler:
        description: 'Paralel parçalar (JSON liste, her biri "YYYY-AA-GG:YYYY-AA-GG")'
        default: '["2019-01-01:9999-12-31"]'
      sure:
        description: "Her parça en fazla kaç dakika indirsin"
        default: "300"
      hepsi:
        description: "İY/MS'siz ligleri de indir"
        type: boolean
        default: false

concurrency:
  group: arsiv-oran
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tazele:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Arşivin son ayını tazele
        run: python -m iddaa.arsiv --baslangic "$(date -u -d '-3 days' +%Y-%m-01)"
      - name: Kaydet
        run: bash scripts/kaydet.sh "Mackolik arşivi (tazeleme)" || true

  oranlar:
    needs: tazele
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        donem: ${{ fromJSON(inputs.donemler || '["2019-01-01:9999-12-31"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Maç sayfalarından oranlar
        env:
          DONEM: ${{ matrix.donem }}
          SURE: ${{ inputs.sure || '300' }}
          HEPSI: ${{ inputs.hepsi && '--hepsi' || '' }}
        run: |
          bas="${DONEM%%:*}"; bit="${DONEM##*:}"
          son=$(( $(date +%s) + SURE * 60 ))
          while :; do
            kalan=$(( (son - $(date +%s)) / 60 ))
            [ "$kalan" -lt 2 ] && break
            dilim=$(( kalan < 30 ? kalan : 30 ))
            git pull -q --rebase || true
            kod=0
            python -m iddaa.arsiv_oran --baslangic "$bas" --bitis "$bit" --sure "$dilim" $HEPSI || kod=$?
            bash scripts/kaydet.sh "Geçmiş maç oranları $bas..$bit"
            case $kod in
              0) ;;
              3) echo "Aralık tamamlandı."; break ;;
              4) echo "::warning::Mackolik istekleri reddetti, parça durdu."; break ;;
              *) exit "$kod" ;;
            esac
          done

  analiz:
    needs: oranlar
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: veri
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: iddaa geçmişiyle model (kalibrasyon, geriye test)
        run: python -m iddaa.kalibrasyon
      - name: Paneli güncelle
        run: python -m iddaa.panel
      - name: Kaydet
        run: bash scripts/kaydet.sh "Model (iddaa geçmişi)"
