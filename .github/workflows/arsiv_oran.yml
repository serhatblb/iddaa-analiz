name: Geçmiş maç oranları

# Arşivdeki iddaa maçlarının sayfalarından bütün önemli oranlar (İY/MS, toplam gol, KG...), en yeniden eskiye.
# Her çalışma en fazla `sure` dakika indirir, kaldığı yerden devam eder.
on:
  schedule:
    - cron: "23 1 * * *"  # her gece 04:23 TR
  workflow_dispatch:
    inputs:
      sure:
        description: "En fazla kaç dakika indirilsin"
        default: "300"
      baslangic:
        description: "En eski tarih (YYYY-AA-GG)"
        default: "2019-01-01"

concurrency:
  group: arsiv-oran
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  oranlar:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Arşivin son ayını tazele
        run: python -m iddaa.arsiv --baslangic "$(date -u -d '-3 days' +%Y-%m-01)"
      - name: Maç sayfalarından oranlar
        env:
          SURE: ${{ inputs.sure || '300' }}
          BASLANGIC: ${{ inputs.baslangic || '2019-01-01' }}
        run: python -m iddaa.arsiv_oran --sure "$SURE" --baslangic "$BASLANGIC"
      - name: Kaydet
        if: always()
        run: bash scripts/kaydet.sh "Geçmiş maç oranları"
